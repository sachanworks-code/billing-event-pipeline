openapi: 3.0.3
info:
  title: Billing Event Pipeline
  version: 1.0.0
  description: Synthetic billing event ingestion with asynchronous persistence and audit delivery.
servers:
  - url: http://localhost:8080
security:
  - apiKey: []
paths:
  /api/v1/billing-events:
    post:
      summary: Accept a validated event into Kafka
      description: Acknowledgement does not imply persistence. Retry ambiguous failures with the same ID and payload.
      operationId: submitBillingEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingEvent'}
      responses:
        '202':
          description: Kafka acknowledged the event
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [eventId, submissionId, status]
                properties:
                  eventId: {type: string, format: uuid}
                  submissionId: {type: string, format: uuid}
                  status: {type: string, enum: [ACCEPTED]}
        '400': {description: Invalid JSON or event contract}
        '503': {description: Broker acknowledgement unavailable; delivery may be ambiguous}
  /api/v1/billing-events/{eventId}:
    get:
      summary: Look up a persisted event and its audit publication status
      operationId: getBillingEvent
      parameters:
        - in: path
          name: eventId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Event persisted
          content:
            application/json:
              schema:
                type: object
                required: [event, status, auditStatus]
                properties:
                  event: {$ref: '#/components/schemas/BillingEvent'}
                  status: {type: string, enum: [PERSISTED]}
                  auditStatus: {type: string, enum: [PENDING, PUBLISHED]}
        '400': {description: Invalid UUID}
        '404': {description: Event not persisted; may still be processing or may have failed}
  /api/v1/dashboard/summary:
    get:
      summary: Live metrics and submission activity
      responses:
        '200': {description: Dashboard data; response fields documented in docs/dashboard.md}
        '400': {description: Invalid filter or identifier}
        '401': {description: Missing or invalid API key}
  /api/v1/dashboard/submissions:
    get:
      summary: Paginated submission receipts
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
        - in: query
          name: search
          schema: {type: string, maxLength: 64}
        - in: query
          name: status
          schema: {type: string, enum: [ALL, SUBMITTING, ACCEPTED, PROCESSED, DUPLICATE, FAILED, UNKNOWN], default: ALL}
      responses:
        '200': {description: Dashboard data; response fields documented in docs/dashboard.md}
        '400': {description: Invalid filter or identifier}
        '401': {description: Missing or invalid API key}
  /api/v1/dashboard/submissions/{id}:
    get:
      summary: Submission timeline and original event
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Dashboard data; response fields documented in docs/dashboard.md}
        '400': {description: Invalid filter or identifier}
        '401': {description: Missing or invalid API key}
        '404': {description: Record not found}
  /api/v1/dashboard/failures:
    get:
      summary: Paginated dead-letter observations
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200': {description: Dashboard data; response fields documented in docs/dashboard.md}
        '400': {description: Invalid filter or identifier}
        '401': {description: Missing or invalid API key}
  /api/v1/dashboard/failures/{id}:
    get:
      summary: Failure reason and raw payload
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Dashboard data; response fields documented in docs/dashboard.md}
        '400': {description: Invalid filter or identifier}
        '401': {description: Missing or invalid API key}
        '404': {description: Record not found}
components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}
  schemas:
    BillingEvent:
      type: object
      additionalProperties: false
      required: [eventId, invoiceId, customerId, amount, currency, billingDate]
      properties:
        eventId: {type: string, format: uuid}
        invoiceId: {type: string, minLength: 1, maxLength: 64, example: INV-DEMO-1001}
        customerId: {type: string, minLength: 1, maxLength: 64, example: CUSTOMER-DEMO-01}
        amount: {type: number, minimum: 0.01, maximum: 999999999999.99, multipleOf: 0.01, example: 1499.00}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: INR}
        billingDate: {type: string, format: date, example: '2026-10-01'}
